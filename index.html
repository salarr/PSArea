<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پولیس اسٹیشن علاقہ تلاش</title>

<style>
/* ==========================================
   FONT: Jameel Noori Nastaleeq (sirf Urdu text)
   Font file: fonts/JameelNooriNastaleeq.woff2 / .ttf
   ========================================== */
@font-face {
    font-family: "Jameel Noori Nastaleeq";
    src: url("fonts/JameelNooriNastaleeq.woff2") format("woff2"),
         url("fonts/JameelNooriNastaleeq.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+06D4, U+060C, U+061B, U+061F;
}

/* ==========================================
   COLORS: Indigo & Aqua
   ========================================== */
:root {
    --bg: #f1f2fa;
    --surface: #ffffff;
    --line: #dfe1f2;
    --field-bg: #f8f8fd;
    --field-line-hover: #bcc0e6;

    --primary: #2b2a6b;
    --primary-2: #4340a8;
    --primary-rgb: 43,42,107;

    --accent: #0ea5a4;
    --accent-dark: #0b8584;
    --accent-ink: #ffffff;
    --accent-rgb: 14,165,164;

    --row-hover: #f5f5fc;
}

:root {
    --ink: #000000;
    --success: #15803d;
    --danger: #d93025;

    --font-urdu: "Jameel Noori Nastaleeq", "Segoe UI", Tahoma, Arial, sans-serif;

    --shadow-sm: 0 2px 8px rgba(var(--primary-rgb), .08);
    --shadow-md: 0 12px 34px rgba(var(--primary-rgb), .12);
    --shadow-lg: 0 24px 60px rgba(var(--primary-rgb), .24);
}

* {
    box-sizing: border-box;
    font-family: var(--font-urdu);
}

html, body, button, input, select, textarea {
    font-family: var(--font-urdu);
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    background:
        radial-gradient(900px 480px at 90% -10%, rgba(var(--accent-rgb), .14), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(var(--primary-rgb), .10), transparent 60%),
        var(--bg);
    color: var(--ink);
    line-height: 1.9;
    transition: background .3s ease;
}

/* ==========================================
   LAYOUT
   ========================================== */
.container {
    max-width: 980px;
    margin: 0 auto;
    position: relative;
    animation: rise .5s ease both;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}

.header {
    text-align: center;
    padding: 36px 24px 4px;
    position: relative;
}

.logo {
    display: block;
    width: 120px;
    height: 120px;
    margin: 0 auto 12px;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px rgba(var(--primary-rgb), .22));
    position: relative;
    z-index: 1;
}

.main-heading {
    color: var(--primary);
    margin: 0 0 2px;
    font-size: 33px;
    font-weight: 700;
    position: relative;
    z-index: 1;
}

.content {
    padding: 28px;
}

/* ==========================================
   SEARCH AREA
   ========================================== */
.search-area {
    display: flex;
    gap: 12px;
    align-items: stretch;
    flex-wrap: wrap;
}

.search-wrap {
    position: relative;
    flex: 1 1 340px;
}

.search-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #5b6578;
    pointer-events: none;
    transition: color .2s ease;
}

.search-wrap:focus-within .search-icon {
    color: var(--accent-dark);
}

#searchBox {
    width: 100%;
    padding: 14px 56px 14px 20px;
    font-size: 23px;               /* pehle 17px tha (+6) */
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--field-bg);
    color: var(--ink);
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

#searchBox:hover {
    border-color: var(--field-line-hover);
    background: #fff;
}

#searchBox:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .18);
}

#searchBox::placeholder {
    color: #8a94a6;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

/* ==========================================
   BUTTONS
   ========================================== */
button {
    border: none;
    cursor: pointer;
    border-radius: 12px;
    padding: 0 22px;
    min-height: 56px;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    box-shadow: 0 6px 16px rgba(var(--primary-rgb), .26);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    white-space: nowrap;
}

button:hover {
    background: var(--primary-2);
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(var(--primary-rgb), .34);
}

button:active {
    transform: translateY(0);
    box-shadow: 0 3px 8px rgba(var(--primary-rgb), .22);
}

button:focus-visible {
    outline: 3px solid rgba(var(--accent-rgb), .45);
    outline-offset: 2px;
}

.btn-ghost {
    background: #fff;
    color: var(--ink);
    border: 1.5px solid var(--line);
    box-shadow: var(--shadow-sm);
}

.btn-ghost:hover {
    background: var(--row-hover);
    border-color: var(--accent);
    color: var(--ink);
    box-shadow: var(--shadow-md);
}

.btn-accent {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 6px 16px rgba(var(--accent-rgb), .35);
}

.btn-accent:hover {
    background: var(--accent-dark);
    color: var(--accent-ink);
    box-shadow: 0 10px 22px rgba(var(--accent-rgb), .45);
}

.btn-secondary {
    background: #fff !important;
    color: var(--ink) !important;
    border: 1.5px solid var(--line) !important;
    box-shadow: none !important;
}

.btn-secondary:hover {
    background: var(--row-hover) !important;
    border-color: var(--field-line-hover) !important;
}

/* ==========================================
   SUGGESTIONS
   ========================================== */
.suggestions-box {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 8px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    z-index: 9999;
    display: none;
    animation: drop .18s ease both;
}

@keyframes drop {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
}

.suggestion-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 12px 20px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    border-right: 4px solid transparent;
    transition: background .15s ease, border-color .15s ease, padding-right .15s ease;
}

.suggestion-item:last-child {
    border-bottom: none;
}

.suggestion-item:hover {
    background: var(--row-hover);
    border-right-color: var(--accent);
    padding-right: 24px;
}

.suggestion-area {
    flex: 1;
    min-width: 0;
    font-weight: 600;
    font-size: 21px;               /* pehle 15px tha (+6) */
    color: var(--primary);         /* Indigo */
    text-align: right;
}

.suggestion-ps {
    flex-shrink: 0;
    max-width: 50%;
    font-size: 23px;               /* police station: bold, pehle 20px tha (+3) */
    font-weight: 700;
    color: var(--accent-dark);     /* Aqua */
    text-align: left;
}

.dim-text {
    color: inherit;
}

.match-text {
    color: inherit;
    font-weight: 700;
    background: rgba(var(--accent-rgb), .28);
    border-radius: 4px;
    padding: 0 2px;
}

/* ==========================================
   FOOTER
   ========================================== */
.footer {
    text-align: center;
    padding: 14px 20px 20px;
    font-size: 18px;
    color: #000;
}

.footer strong {
    color: var(--primary);
}

/* ==========================================
   TOAST
   ========================================== */
#toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--primary);
    color: #fff;
    padding: 12px 26px;
    border-radius: 14px;
    font-size: 19px;
    box-shadow: 0 14px 34px rgba(0,0,0,.22);
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: .3s ease;
    text-align: center;
    min-width: 280px;
}

#toast.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

#toast.loading { background: var(--primary); }
#toast.success { background: var(--success); }
#toast.error   { background: var(--danger); }

.toast-line-1 {
    display: block;
    font-weight: 700;
}

.toast-line-2 {
    display: block;
    font-size: 17px;
    margin-top: 2px;
    opacity: .9;
}

/* ==========================================
   MODAL
   ========================================== */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(var(--primary-rgb), .55);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 16px;
}

.modal-overlay.open {
    display: flex;
    animation: fade .2s ease both;
}

@keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

.modal-box {
    background: #fff;
    width: 100%;
    max-width: 460px;
    border-radius: 20px;
    padding: 26px;
    box-shadow: var(--shadow-lg);
    max-height: 90vh;
    overflow-y: auto;
    border-top: 5px solid var(--accent);
    animation: pop .25s ease both;
}

@keyframes pop {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-box h3 {
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    color: var(--primary);
    text-align: center;
    font-size: 25px;
}

.modal-box label {
    display: block;
    font-size: 19px;
    color: #000;
    margin: 14px 0 6px;
}

.modal-box select,
.modal-box input,
.modal-box textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--field-bg);
    font-size: 20px;
    color: var(--ink);
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

.modal-box select:hover,
.modal-box input:hover,
.modal-box textarea:hover {
    border-color: var(--field-line-hover);
    background: #fff;
}

.modal-box select:focus,
.modal-box input:focus,
.modal-box textarea:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .18);
}

.modal-box textarea {
    min-height: 120px;
    resize: vertical;
}

.modal-msg {
    min-height: 22px;
    margin-top: 12px;
    font-size: 19px;
    font-weight: 600;
}

.modal-msg.loading { color: var(--primary-2); }
.modal-msg.success { color: var(--success); }
.modal-msg.error   { color: var(--danger); }

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.modal-actions button {
    flex: 1;
    min-height: 48px;
}

/* ==========================================
   MOBILE
   ========================================== */
@media (max-width: 640px) {

    body { padding: 14px 10px; }

    .header { padding: 30px 16px 22px; }

    .logo { width: 96px; height: 96px; }

    .main-heading { font-size: 27px; }

        .content { padding: 18px; }

    .search-area { flex-direction: column; }

    .actions { width: 100%; }

    .actions button {
        flex: 1;
        padding: 0 10px;
    }

    #searchBox { font-size: 22px; }

    .suggestion-area { font-size: 19px; }

    .suggestion-ps { font-size: 20px;
    font-weight: 700;
}

    #toast {
        min-width: 260px;
        max-width: 92%;
    }
}

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

</style>
</head>

<script>

/* ==========================================
   GOOGLE APPS SCRIPT
   ========================================== */

const GOOGLE_SHEET_API =
"https://script.google.com/macros/s/AKfycbzsZY4QHGaskZwoXyrnmGSObPzDdo8U-DhfSKSSfzPmsKUCGoFNkQL4EsBsf20_H_PY/exec";

let policeStations = [];
let rawPoliceStations = [];


/* ==========================================
   EXPAND AREAS
   ========================================== */

function expandAreas(data) {

    const expanded = [];

    data.forEach(item => {

        const ps = String(item.ps ?? "").trim();
        const areaRaw = String(item.area ?? "");

        const parts = areaRaw
            .split(/\s*[,،\/\n]+\s*/)
            .map(p => p.trim())
            .filter(p => p !== "");

        if (!parts.length) {
            expanded.push({ ps: ps, area: areaRaw.trim() });
        } else {
            parts.forEach(part => {
                expanded.push({ ps: ps, area: part });
            });
        }

    });

    return expanded;
}


/* ==========================================
   TOAST
   ========================================== */

let toastTimer;

function setStatus(message, stateClass) {

    const toast = document.getElementById("toast");

    clearTimeout(toastTimer);

    let developerText = "تیار کردہ: مسٹر ماجد علی";

    if (stateClass === "loading-state") {
        developerText = "تیار کردہ: مسٹر ماجد علی";
    }

    toast.innerHTML = `
        <span class="toast-line-1">${escapeHTML(message)}</span>
        <span class="toast-line-2">${escapeHTML(developerText)}</span>
    `;

    toast.className = "";

    if (stateClass === "ready-state") {
        toast.classList.add("success");
    } else if (stateClass === "error-state") {
        toast.classList.add("error");
    } else {
        toast.classList.add("loading");
    }

    toast.classList.add("show");

    toastTimer = setTimeout(function() {
        toast.classList.remove("show");
    }, 3500);
}


/* ==========================================
   LOAD DATA
   ========================================== */

async function loadData() {

    setStatus("⏳ ڈیٹا لوڈ ہو رہا ہے، براہِ کرم انتظار کریں...", "loading-state");

    try {

        const response = await fetch(
            GOOGLE_SHEET_API + "?t=" + new Date().getTime()
        );

        if (!response.ok) {
            throw new Error("Google Sheet connection failed");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Invalid data received");
        }

        /*
         * صرف approved records.
         * پرانے records جن میں status نہیں
         * وہ بھی search میں رہیں گے۔
         */

        rawPoliceStations = data.filter(item => {

            const status = String(
                item.status ??
                item.Status ??
                item.approval ??
                item.Approval ??
                ""
            ).trim().toLowerCase();

            return (
                !status ||
                ["approved", "approve", "yes", "true", "1"].includes(status)
            );

        });

        policeStations = expandAreas(rawPoliceStations);

        setStatus("✅ اب آپ تلاش کر سکتے ہیں", "ready-state");

        return true;

    } catch (error) {

        console.error(error);

        setStatus("❌ ڈیٹا لوڈ نہیں ہو سکا", "error-state");

        return false;
    }
}


/* ==========================================
   SEARCH
   ========================================== */

function searchData() {

    const searchBox = document.getElementById("searchBox");
    const rawInput = searchBox.value.trim();

    if (!rawInput) {
        hideSuggestions();
        return;
    }

    showSuggestions(rawInput);
}


/* ==========================================
   SUGGESTIONS
   ========================================== */

function showSuggestions(rawInput) {

    const box = document.getElementById("suggestionsBox");

    if (!rawInput || !policeStations.length) {
        hideSuggestions();
        return;
    }

    const q = rawInput.toLowerCase();

    const matches = policeStations
        .filter(item => {

            const area = String(item.area ?? "").toLowerCase();
            const ps = String(item.ps ?? "").toLowerCase();

            return area.includes(q) || ps.includes(q);

        })
        .slice(0, 8);

    if (!matches.length) {
        hideSuggestions();
        return;
    }

    box.innerHTML = "";

    matches.forEach(item => {

        const area = String(item.area ?? "");
        const ps = String(item.ps ?? "");

        const row = document.createElement("div");
        row.className = "suggestion-item";

        const areaDiv = document.createElement("div");
        areaDiv.className = "suggestion-area";
        areaDiv.appendChild(buildHighlightedText(area, rawInput));

        const psDiv = document.createElement("div");
        psDiv.className = "suggestion-ps";
        psDiv.textContent = ps;

        row.appendChild(areaDiv);
        row.appendChild(psDiv);

        row.addEventListener("mousedown", function(event) {
            event.preventDefault();
            selectSuggestion(area, ps);
        });

        box.appendChild(row);

    });

    box.style.display = "block";
}


/* ==========================================
   HIGHLIGHT
   ========================================== */

function buildHighlightedText(fullText, query) {

    const container = document.createElement("span");

    const lowerFull = fullText.toLowerCase();
    const lowerQuery = query.toLowerCase();

    const idx = lowerFull.indexOf(lowerQuery);

    if (idx === -1 || !query) {

        const dim = document.createElement("span");
        dim.className = "dim-text";
        dim.textContent = fullText;
        container.appendChild(dim);

        return container;
    }

    const before = fullText.substring(0, idx);
    const match = fullText.substring(idx, idx + query.length);
    const after = fullText.substring(idx + query.length);

    if (before) {
        const beforeSpan = document.createElement("span");
        beforeSpan.className = "dim-text";
        beforeSpan.textContent = before;
        container.appendChild(beforeSpan);
    }

    const matchSpan = document.createElement("span");
    matchSpan.className = "match-text";
    matchSpan.textContent = match;
    container.appendChild(matchSpan);

    if (after) {
        const afterSpan = document.createElement("span");
        afterSpan.className = "dim-text";
        afterSpan.textContent = after;
        container.appendChild(afterSpan);
    }

    return container;
}


/* ==========================================
   SELECT SEARCH RESULT
   ========================================== */

function selectSuggestion(area, ps) {

    const searchBox = document.getElementById("searchBox");

    searchBox.value = area + " - " + ps;

    hideSuggestions();

    searchBox.focus();
}


/* ==========================================
   HIDE SUGGESTIONS
   ========================================== */

function hideSuggestions() {

    const box = document.getElementById("suggestionsBox");

    if (box) {
        box.style.display = "none";
        box.innerHTML = "";
    }
}


/* ==========================================
   CLEAR
   ========================================== */

function clearSearch() {

    document.getElementById("searchBox").value = "";

    hideSuggestions();

    document.getElementById("searchBox").focus();
}


/* ==========================================
   GET UNIQUE PS
   ========================================== */

function getUniquePS() {

    return [
        ...new Set(
            rawPoliceStations
                .map(item => String(item.ps ?? "").trim())
                .filter(ps => ps !== "")
        )
    ].sort();
}


/* ==========================================
   FILL PS SELECT (helper)
   ========================================== */

function fillPSSelect(selectId) {

    const select = document.getElementById(selectId);

    select.innerHTML = "";

    const uniquePS = getUniquePS();

    uniquePS.forEach(ps => {
        const option = document.createElement("option");
        option.value = ps;
        option.textContent = ps;
        select.appendChild(option);
    });

    if (!uniquePS.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "ڈیٹا لوڈ ہونے دیں";
        select.appendChild(option);
    }
}


/* ==========================================
   ADD MODAL
   ========================================== */

function openAddModal() {

    fillPSSelect("psSelect");

    document.getElementById("newAreaInput").value = "";
    document.getElementById("addModalMsg").textContent = "";

    document.getElementById("addModalOverlay").classList.add("open");
}

function closeAddModal() {
    document.getElementById("addModalOverlay").classList.remove("open");
}


/* ==========================================
   SUBMIT ADD
   ========================================== */

async function submitNewEntry() {

    const ps = document.getElementById("psSelect").value.trim();
    const area = document.getElementById("newAreaInput").value.trim();
    const msg = document.getElementById("addModalMsg");

    if (!ps) {
        msg.textContent = "⚠️ پولیس اسٹیشن منتخب کریں";
        msg.className = "modal-msg error";
        return;
    }

    if (!area) {
        msg.textContent = "⚠️ علاقہ لکھیں";
        msg.className = "modal-msg error";
        return;
    }

    msg.textContent = "⏳ محفوظ ہو رہا ہے...";
    msg.className = "modal-msg loading";

    try {

        const response = await fetch(GOOGLE_SHEET_API, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "add",
                ps: ps,
                area: area,
                status: "Pending"
            })
        });

        const result = await response.json();

        if (result.status === "success") {

            msg.textContent = "✅ منظوری کے انتظار میں محفوظ ہو گیا";
            msg.className = "modal-msg success";

            document.getElementById("newAreaInput").value = "";

            /*
             * IMPORTANT:
             * یہاں نئے record کو search list میں add نہیں کیا گیا۔
             * Admin approve کرے گا، پھر reload پر search میں آئے گا۔
             */

        } else {
            throw new Error(result.message || "Save failed");
        }

    } catch (error) {

        console.error(error);

        msg.textContent = "❌ محفوظ نہیں ہو سکا";
        msg.className = "modal-msg error";
    }
}


/* ==========================================
   CORRECTION MODAL
   ========================================== */

function openCorrectionModal() {

    fillPSSelect("correctionPsSelect");

    document.getElementById("correctionInput").value = "";
    document.getElementById("correctionModalMsg").textContent = "";

    document.getElementById("correctionModalOverlay").classList.add("open");
}

function closeCorrectionModal() {
    document.getElementById("correctionModalOverlay").classList.remove("open");
}


/* ==========================================
   SUBMIT CORRECTION
   ========================================== */

async function submitCorrection() {

    const ps = document.getElementById("correctionPsSelect").value.trim();
    const correction = document.getElementById("correctionInput").value.trim();
    const msg = document.getElementById("correctionModalMsg");

    if (!ps) {
        msg.textContent = "⚠️ پولیس اسٹیشن منتخب کریں";
        msg.className = "modal-msg error";
        return;
    }

    if (!correction) {
        msg.textContent = "⚠️ تصحیح لکھیں";
        msg.className = "modal-msg error";
        return;
    }

    msg.textContent = "⏳ تصحیح محفوظ ہو رہی ہے...";
    msg.className = "modal-msg loading";

    try {

        const response = await fetch(GOOGLE_SHEET_API, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "correction",
                ps: ps,
                correction: correction,
                status: "Pending"
            })
        });

        const result = await response.json();

        if (result.status === "success") {

            msg.textContent = "✅ تصحیح منظوری کے انتظار میں محفوظ ہو گئی";
            msg.className = "modal-msg success";

            document.getElementById("correctionInput").value = "";

        } else {
            throw new Error(result.message || "Correction failed");
        }

    } catch (error) {

        console.error(error);

        msg.textContent = "❌ تصحیح محفوظ نہیں ہو سکی";
        msg.className = "modal-msg error";
    }
}


/* ==========================================
   OUTSIDE MODAL CLICK
   ========================================== */

document.getElementById("addModalOverlay").addEventListener("click", function(event) {
    if (event.target === this) closeAddModal();
});

document.getElementById("correctionModalOverlay").addEventListener("click", function(event) {
    if (event.target === this) closeCorrectionModal();
});


/* ==========================================
   ESC
   ========================================== */

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeAddModal();
        closeCorrectionModal();
        hideSuggestions();
    }
});


/* ==========================================
   SEARCH INPUT
   ========================================== */

document.getElementById("searchBox").addEventListener("input", function() {
    searchData();
});

document.getElementById("searchBox").addEventListener("keydown", function(event) {
    if (event.key === "Enter" || event.key === "Escape") {
        hideSuggestions();
    }
});


/* ==========================================
   OUTSIDE SEARCH CLICK
   ========================================== */

document.addEventListener("click", function(event) {

    const box = document.getElementById("suggestionsBox");
    const searchBox = document.getElementById("searchBox");

    if (box && !box.contains(event.target) && event.target !== searchBox) {
        hideSuggestions();
    }

});


/* ==========================================
   SECURITY
   ========================================== */

function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================================
   PAGE LOAD
   ========================================== */

window.addEventListener("DOMContentLoaded", async function() {
    await loadData();
});
